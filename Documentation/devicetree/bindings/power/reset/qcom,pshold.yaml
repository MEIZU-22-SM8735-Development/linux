%YAML 1.2
---
$id: http://devicetree.org/schemas/power/reset/qcom,pshold.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm SoC restart and power off

maintainers:
  - Bjorn Andersson <bjorn.andersson@linaro.org>

description:
  A power supply hold (ps-hold) bit is set to power the Qualcomm chipsets.
  Clearing that bit allows us to restart/power off. The difference between
  power off and restart is determined by unique power manager IC settings.

properties:
  compatible:
    const: qcom,pshold

  reg:
    maxItems: 1

  qcom,pon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the PMIC PON node that owns the PBS.  Where the PS_HOLD
      sequencing lives in that block (PMK8550 and its relatives), the reset
      type has to be programmed before PS_HOLD is released, or the PMIC treats
      the request as a shutdown.  With this present the driver programs a hard
      reset; without it, its historical behaviour (release PS_HOLD, board powers
      off) is unchanged.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    reset-controller@fc4ab000 {
        compatible = "qcom,pshold";
        reg = <0xfc4ab000 0x4>;
    };
